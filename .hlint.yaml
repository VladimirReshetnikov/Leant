# hlint policy for Leant, mirroring lib/Djex/.hlint.yaml.
#
# Run it with
#   hlint src test-unit
#
# The families below were reported by hlint 3.10 across the quality passes,
# assessed once, and dismissed for the stated reason.  The applied families
# (dead LANGUAGE pragmas, when/unless guards, the standard Maybe/Either
# idioms, isJust/notElem/fromMaybe, redundant map under all/any) should stay
# at zero.
#
# Deliberately NOT ignored, so they stay visible as future work:
# `Use lambda-case` (needs a LANGUAGE pragma per module, worth taking file
# by file) and `Use head`.

- ignore:
    name: Use ++
    # Identity strings split across lines; churn on exact bytes.

- ignore:
    name: Use newtype instead of data
    # Wrapped seal/receipt types whose laziness the tests pin.

- ignore:
    name: Use camelCase
    # Exported names; renaming them is a public API change.

- ignore:
    name: Eta reduce
    # The explicit argument names carry the Haddock parameter documentation.

- ignore:
    name: Hoist not

- ignore:
    name: Use infix

- ignore:
    name: Avoid lambda using `infix`
    # `\needle -> needle `isInfixOf` term` reads as the sentence it asserts;
    # the section swaps the reader's subject and object.

- ignore:
    name: Use record patterns

- ignore:
    name: Use tuple-section

- ignore:
    name: Avoid lambda

- ignore:
    name: Use first
- ignore:
    name: Use second
- ignore:
    name: Use bimap
    # `(length $ fst pair, length $ snd pair)` names both projections at the
    # use site; bimap hides which component is which.

- ignore:
    name: Use >=>
    # The explicit `>>=` chains in the inspection helpers read left to right
    # with the intermediate value visible.

- ignore:
    name: Use <$>
    within:
      - Main
      - Leant.Synth.Engine
      - Leant.Synth.Length.Ranking.Internal
      - Leant.Synth.Length.SpinePair.Ranking.Internal
    # The remaining `fmap f $ g long args` sites in these modules keep the
    # `$` so the argument list layout survives; rewriting to `<$>` re-wraps
    # every call.  Assessed in the first pass; new modules still get the
    # hint.

- ignore:
    name: Use fewer imports
    within: Leant.Synth.Length.File.Acquire
    # Control.Monad is imported twice on purpose: `void` is used only by the
    # POSIX-only descriptor code, so its import lives inside the same
    # `#ifndef mingw32_HOST_OS` block as those uses.

- ignore:
    name: Use flip
    within: Main
    # hlint 3.10 suggests `flip fst source` for `($ source) . fst`, which is
    # ill-typed (fst is not binary); the composition is correct as written.
