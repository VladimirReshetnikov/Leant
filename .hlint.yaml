# hlint policy for Leant.
#
# Run it with `hlint src`.  Everything below was reported by hlint 3.10,
# assessed once, and dismissed for the stated reason; ignoring it here keeps a
# fresh run down to hints nobody has looked at yet.  Anything hlint reports
# that is not listed here is new, and should be read.
#
# The genuine simplifications hlint found -- readTVarIO, `when` guard ladders,
# the isNothing/isJust/fromMaybe/mapMaybe idioms, redundant `pure` tails --
# were applied, so those families should stay at zero.

- ignore:
    name: Eta reduce
    # The explicit argument names carry this codebase's Haddock parameter
    # documentation; eta-reducing them deletes the names the comments use.

- ignore:
    name: Use newtype instead of data
    # Several of these wrap seal, receipt and cursor types whose laziness the
    # tests pin: a newtype is forced when its contents are, a data wrapper is
    # not, and that difference is exactly what some characterizations check.

- ignore:
    name: Use <$>
    # The `fmap f $ g a b c` layout is load-bearing across the Length ranking
    # internals' long argument lists; rewriting it to `<$>` moves the line
    # break into the middle of an argument list and, in one case, broke a
    # characterization test that pins the bind it appears in.

- ignore:
    name: Hoist not
    # `any (not . p) xs` reads as "some element fails p", which is the
    # question being asked; `not (all p xs)` is the same length and says it
    # backwards.

- ignore:
    name: Use infix
    # Prefix `elem spelling ["Prod", "Sum"]` keeps the operand order of the
    # surrounding validator ladders.

- ignore:
    name: Use camelCase
    # These are exported names; renaming them is a public API change.

- ignore:
    name: Avoid lambda

- ignore:
    name: Use tuple-section

- ignore:
    name: Use fewer imports
    # The duplicate import hlint sees is a second import list inside a
    # `#ifndef mingw32_HOST_OS` block: merging it would import a name that is
    # unused on Windows.

- ignore:
    name: Evaluate
    # `const (pure []) (e :: SomeException)` pins the exception type of a
    # discarded handler argument.
